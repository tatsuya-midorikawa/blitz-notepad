[package]
name = "blitz-notepad"
version = "0.1.0"
edition = "2021"
description = "A high-performance Notepad-compatible text editor core."
license = "MIT"

[lib]
name = "blitz_notepad"
path = "src/lib.rs"

[[bin]]
name = "blitzpad"
path = "src/main.rs"

[dependencies]
dirs = "6.0"
encoding_rs = "0.8"
ab_glyph = "0.2"
fontdb = "0.23"
memchr = "2.7"
memmap2 = "0.9"
minifb = "0.27"
pixels = "0.17.1"
png = "0.17"
arboard = "3.4"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
swash = "0.2.7"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
urlencoding = "2.1"
webbrowser = "1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false